<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="512" height="512">
  <!-- Versión icono de app: el logo sobre un cuadrado redondeado con el fondo oscuro de la web -->
  <defs>
    <radialGradient id="fondo" cx="30%" cy="20%" r="90%">
      <stop offset="0" stop-color="#16324a" />
      <stop offset="0.55" stop-color="#0d101a" />
      <stop offset="1" stop-color="#2a1530" />
    </radialGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.45" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="24" height="24" rx="5.4" fill="url(#fondo)" />
  <g transform="translate(12 12) scale(0.72) translate(-12 -12)">
    <circle cx="12" cy="12" r="9" fill="none" stroke="#4ae9f9" stroke-width="6" opacity="0.18" />
    <g filter="url(#brillo)">
      <circle cx="12" cy="12" r="9" fill="none" stroke="#4ae9f9" stroke-width="2" />
      <circle cx="12" cy="12" r="3.5" fill="#ff5c82" />
    </g>
  </g>
</svg>
