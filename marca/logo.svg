<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 28 28" width="512" height="512">
  <!-- Logo de Marvel Movies: el anillo del "reactor arc" (mismo dibujo que components/logo.tsx, colores del tema oscuro) -->
  <defs>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.6" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <circle cx="12" cy="12" r="9" fill="none" stroke="#4ae9f9" stroke-width="6" opacity="0.18" />
  <g filter="url(#brillo)">
    <circle cx="12" cy="12" r="9" fill="none" stroke="#4ae9f9" stroke-width="2" />
    <circle cx="12" cy="12" r="3.5" fill="#ff5c82" />
  </g>
</svg>
